<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Skill Tree – v0.3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">SKILL TREE</p>
        <h1>Push-ups</h1>
      </div>
      <button id="resetBtn" class="ghost-btn" type="button">Testdaten löschen</button>
    </header>

    <section class="stats" aria-label="Fortschritt">
      <article>
        <span>Rekord</span>
        <strong id="maxStat">0</strong>
      </article>
      <article>
        <span>Gesamt</span>
        <strong id="totalStat">0</strong>
      </article>
      <article>
        <span>Streak</span>
        <strong><span id="streakStat">0</span> Tage</strong>
      </article>
      <article>
        <span>Rang</span>
        <strong id="rankStat">Start</strong>
      </article>
    </section>

    <section class="tree-wrap">
      <div class="tree" id="skillTree" aria-label="Push-up Skill Tree"></div>
    </section>

    <button id="openTrainingBtn" class="training-main-btn" type="button">
      + Training
    </button>
  </main>

  <!-- Trainingsflow -->
  <div id="trainingModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="trainingTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <button id="backBtn" class="icon-btn hidden" type="button" aria-label="Zurück">←</button>
        <div>
          <p class="eyebrow">TRAINING</p>
          <h2 id="trainingTitle">Übung auswählen</h2>
        </div>
        <button id="closeTrainingBtn" class="icon-btn" type="button" aria-label="Schließen">✕</button>
      </div>

      <!-- Schritt 1 -->
      <section id="exerciseStep" class="step">
        <button class="exercise-card active" data-exercise="pushups" type="button">
          <span class="exercise-icon">💪</span>
          <span>
            <strong>Push-ups</strong>
            <small>Kamera + Timer + Wiederholungen</small>
          </span>
          <span>›</span>
        </button>

        <button class="exercise-card" type="button" disabled>
          <span class="exercise-icon">🦵</span>
          <span>
            <strong>Squats</strong>
            <small>Kommt als Nächstes</small>
          </span>
          <span>🔒</span>
        </button>

        <button class="exercise-card" type="button" disabled>
          <span class="exercise-icon">🔥</span>
          <span>
            <strong>Sit-ups</strong>
            <small>Noch nicht aktiv</small>
          </span>
          <span>🔒</span>
        </button>

        <button class="exercise-card" type="button" disabled>
          <span class="exercise-icon">⏱️</span>
          <span>
            <strong>Plank</strong>
            <small>Noch nicht aktiv</small>
          </span>
          <span>🔒</span>
        </button>
      </section>

      <!-- Schritt 2 -->
      <section id="cameraStep" class="step hidden">
        <div class="camera-box">
          <video id="cameraVideo" autoplay muted playsinline></video>
          <div id="cameraPlaceholder" class="camera-placeholder">
            <span>📷</span>
            <strong>Kamera noch nicht gestartet</strong>
            <small>Das Video wird nicht hochgeladen.</small>
          </div>

          <div id="timerOverlay" class="timer-overlay hidden">
            <span>Training läuft</span>
            <strong id="timerDisplay">00:00</strong>
          </div>
        </div>

        <p id="cameraStatus" class="status-text">
          Starte zuerst die Kamera. Danach kannst du das Training beginnen.
        </p>

        <div class="button-stack">
          <button id="startCameraBtn" class="primary-btn" type="button">Kamera starten</button>
          <button id="continueWithoutCameraBtn" class="secondary-btn" type="button">Ohne Kamera weitermachen</button>
          <button id="startWorkoutBtn" class="primary-btn hidden" type="button">Training starten</button>
          <button id="finishWorkoutBtn" class="danger-btn hidden" type="button">Training beenden</button>
        </div>
      </section>

      <!-- Schritt 3 -->
      <section id="resultStep" class="step hidden">
        <div class="result-summary">
          <span>Trainingszeit</span>
          <strong id="finalTime">00:00</strong>
        </div>

        <label class="rep-input-wrap" for="repInput">
          <span>Wie viele Push-ups hast du geschafft?</span>
          <input id="repInput" type="number" min="0" max="9999" inputmode="numeric" placeholder="z. B. 24" />
        </label>

        <button id="saveTrainingBtn" class="primary-btn" type="button">Training speichern</button>
      </section>

      <!-- Schritt 4 -->
      <section id="successStep" class="step hidden">
        <div class="success-mark">✓</div>
        <h3>Training gespeichert</h3>
        <div id="successDetails" class="success-details"></div>
        <button id="doneBtn" class="primary-btn" type="button">Zum Skill Tree</button>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
